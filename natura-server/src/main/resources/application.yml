# server properties
server:
  port: 8081

# database properties
spring:
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
      continue-on-error: true
      data-locations: classpath:/data-mysql.sql

  # multipart file settings
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# JWT properties
jwt:
  secret: naturaSecretKeyToGenerateTokenMustBeMuchMoreLongerSoIAddedSomeCharactersToHaveAValidKeyForHS512Algorithm
  token:
    expiration.ms: 43200000

# custom properties
validation:
  countNeeded: 10